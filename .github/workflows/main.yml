name: Sovereign AI CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  provision:
    name: 'Terraform Provisioning'
    runs-on: ubuntu-latest
    outputs:
      instance_ip: ${{ steps.get_ip.outputs.ip }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - run: terraform init
        working-directory: ./terraform
      - run: terraform apply -auto-approve
        working-directory: ./terraform

      - name: Ensure Instance is Running and Get IP
        id: get_ip
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=SovereignAI-Server" "Name=instance-state-name,Values=running" --query "Reservations[0].Instances[0].InstanceId" --output text)
          ip_address=$(aws ec2 describe-instances --instance-ids $INSTANCE_ID --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          echo "ip=${ip_address}" >> $GITHUB_OUTPUT

  sonarqube:
    name: 'SonarCloud Code Analysis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@master
        with:
          projectBaseDir: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  owasp-dependency-check:
    name: 'OWASP Dependency Check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'SovereignAI-Dependencies'
          path: '.'
          format: 'ALL'
          args: >
            --enableRetired
            --failOnCVSS 7.0
        continue-on-error: true

  deploy:
    name: 'Build, Deploy, and Monitor'
    runs-on: ubuntu-latest
    needs: [provision, sonarqube]
    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sovereign-ai:latest

      - name: Deploy via Cloudflare Tunnel
        uses: appleboy/ssh-action@master
        with:
          host: ${{ needs.provision.outputs.instance_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo systemctl start docker
            sudo chmod 666 /var/run/docker.sock

            cat > docker-compose.yml <<EOF
            version: '3.8'
            networks:
              sovereign_network:
                name: sovereign_network
            services:
              cloudflare-tunnel:
                image: cloudflare/cloudflared:latest
                container_name: sovereign-tunnel
                restart: always
                command: tunnel --no-autoupdate run
                environment:
                  - TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TOKEN }}
                networks:
                  - sovereign_network
              sovereign-master:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/sovereign-ai:latest
                container_name: sovereign-master
                restart: always
                environment:
                
                networks:
                  - sovereign_network
            EOF

            sudo docker-compose pull
            sudo docker-compose down
            sudo docker-compose up -d
            sudo docker image prune -f

      - name: Install and Configure CloudWatch Agent
        uses: appleboy/ssh-action@master
        with:
          host: ${{ needs.provision.outputs.instance_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            wget https://s3.amazonaws.com/amazoncloudwatch-agent/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb -O /tmp/amazon-cloudwatch-agent.deb
            sudo dpkg -i -E /tmp/amazon-cloudwatch-agent.deb
            
            sudo bash -c 'cat > /opt/aws/amazon-cloudwatch-agent/bin/config.json <<EOF
            {
              "agent": { "run_as_user": "root" },
              "logs": {
                "logs_collected": {
                  "files": {
                    "collect_list": [
                      {
                        "file_path": "/var/lib/docker/containers/*/*.log",
                        "log_group_name": "SovereignAI-App-Logs",
                        "log_stream_name": "{instance_id}-docker"
                      }
                    ]
                  }
                }
              }
            }
            EOF'

            sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/opt/aws/amazon-cloudwatch-agent/bin/config.json -s
